# Failed user-tested V3 experiment; retained for diagnosis, not a working fix.
# No V1 endpoint is exposed by this frontend.
server {
    listen 6969;
    server_tokens off;
    access_log off;
    error_log /dev/stderr warn;
    client_max_body_size 1m;

    location = /v3/client_info {
        if ($request_method != GET) { return 405; }
        default_type application/json;
        add_header Cache-Control no-store;
        return 200 '{"client_info":"<PC> <Windows;6.2(0,0);9200> <com.apple.AuthKit/1 (com.apple.akd/1.0)>","user_agent":"akd/1.0 CFNetwork/808.1.4"}';
    }

    location = /v3/get_headers {
        if ($request_method != POST) { return 405; }
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_pass http://anisette-backend:6969;
    }

    location = /v3/provisioning_session {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
        proxy_buffering off;
        proxy_pass http://anisette-backend:6969;
    }

    location / { return 404; }
}

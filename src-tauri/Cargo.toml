[package]
name = "sideloom"
version = "2.0.0"
description = "Mac-first IPA inspector, customizer, signer, and installer"
authors = ["nab138"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "sideloom_lib"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
idevice = { version = "0.1.57", default-features = false, features = ["ring", "usbmuxd", "house_arrest", "afc", "core_device_proxy", "remote_pairing", "tcp", "tunnel_tcp_stack", "xpc", "rsd", "pair", "springboardservices"] }
isideload = { version = "0.3.17", default-features = false, features = ["fs-storage", "install", "tokio-mt"], git = "https://github.com/nab138/isideload", package = "isideload", branch = "apple-codesign-quick" }
futures = "0.3.31"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls-no-provider", "http2", "system-proxy"] }
tokio = "1.49.0"
tracing = "0.1.44"
rustls = { version = "0.23.36", default-features = false, features = ["ring", "std", "tls12"] }
plist = "1.8.0"
plist-macro = "0.1.6"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "webp"] }
rootcause = "0.12.1"
thiserror = "2.0.18"
base64 = "0.22"
strum = {version = "0.28.0", features = ["derive"] }
zeroize = "1.8"

name: Bug Report
description: Report a Slip sideloading, device, refresh, or interface problem
body:
  - type: markdown
    attributes:
      value: "Thank you for helping Slip improve. Remove passwords, verification codes, UDIDs, and other private data before posting."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe what you expected, what happened, and the exact step where it failed.
      placeholder: Include reproducible steps and a redacted Activity log or screenshot when useful.
    validations:
      required: true
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight checks
      options:
        - label: I reviewed Slip's Preflight and the complete error message.
          required: true
        - label: My iPhone is unlocked, trusted by this Mac, and visible over USB or Finder Wi-Fi sync.
          required: true
  - type: input
    id: macos
    attributes:
      label: macOS and Mac model
      placeholder: macOS 27.0, MacBook Pro (Apple silicon)
    validations:
      required: true
  - type: input
    id: slip
    attributes:
      label: Slip version
      placeholder: v2.0.0
    validations:
      required: true
  - type: input
    id: iphone
    attributes:
      label: iPhone model and iOS version
      placeholder: iPhone 15, iOS 27.0
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - USB
        - Network
        - Both fail
    validations:
      required: true
  - type: dropdown
    id: account
    attributes:
      label: Apple developer account
      options:
        - Free Personal Team
        - Paid Developer Program
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Add redacted logs, screenshots, IPA size, and whether another IPA works.

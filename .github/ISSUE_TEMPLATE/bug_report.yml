name: Bug Report/Support
description: Report a bug or get help with Slip
body:
- type: markdown
  attributes:
    value: "Thank you for helping Slip improve! To help us track down the bug, please fill out the following information:"
- type: markdown
  attributes:
    value: "## Bug Information"
- type: textarea
  id: info
  attributes:
    label: Describe the issue
    description: A brief summary of the problem and how to reproduce it
    placeholder: Description here...
  validations:
    required: true
- type: textarea
  id: error
  attributes:
    label: Error message
    description: "If this issue has an error message or log output, copy it from the error dialog or the Activity timeline in Slip and paste here. You can also upload screenshots or log files."
    placeholder: Paste error or activity log here
- type: checkboxes
  id: suggestions
  attributes:
    label: "Please read and follow any suggestions Slip gives before making this issue."
    description: Slip provides preflight diagnostics and intelligent suggestions for common signing, device connection, and profile errors. If you open an issue without checking these suggestions, you will simply be directed to follow them.
    options:
      - label: I followed ALL suggestions given by Slip
        required: true
- type: markdown
  attributes:
    value: "## Mac Environment"
- type: input
  id: os
  attributes:
    label: macOS Version
    description: What version of macOS is your Mac running? (e.g. macOS 26.3, macOS 27.0)
    placeholder: macOS 26.3
  validations:
    required: true
- type: input
  id: version
  attributes:
    label: Slip version
    description: What version of Slip are you experiencing this problem with?
    placeholder: v2.7.0
  validations:
    required: true
- type: dropdown
  id: package
  attributes:
    label: How was Slip installed?
    description: "Slip is distributed as an official release disk image (.dmg) or built from source."
    options:
      - .dmg release (GitHub Releases)
      - Built from source (Xcode / SwiftPM)
      - Other (Specify in additional info)
  validations:
    required: true
- type: checkboxes
  id: computerceritifcation
  attributes:
    label: Mac environment certification
    description: Slip is a native macOS application designed for Apple silicon Macs running macOS 26 or newer. macOS handles device communication natively without third-party drivers.
    options:
      - label: I certify that I am running Slip natively on macOS 26+ and my iPhone is trusted in Finder
        required: true
- type: markdown
  attributes:
    value: "## iPhone Information"
- type: input
  id: ios
  attributes:
    label: iOS Version
    description: What iOS version is your iPhone running? If you are on a developer beta, please include that
    placeholder: "26.3"
  validations:
    required: true
- type: input
  id: phone
  attributes:
    label: iPhone model
    description: What model of iPhone is connected? (e.g. iPhone 16 Pro, iPhone 15)
    placeholder: iPhone 16 Pro
  validations:
    required: true
- type: checkboxes
  id: phonecertification
  attributes:
    label: "Please certify the following about your iPhone:"
    description: If any of these things are not true, please make sure they are and try again before opening this issue.
    options:
      - label: My iPhone has Developer Mode enabled
        required: true
      - label: My iPhone has a passcode set
        required: true
      - label: My iPhone is connected via USB or paired on the local Wi-Fi network
        required: true
- type: markdown
  attributes:
    value: "## Apple Account Information"
- type: dropdown
  id: free
  attributes:
    label: Do you have a paid or free developer account?
    description: Unless you specifically paid to join Apple's developer program, choose free.
    options:
      - Free
      - Paid
  validations:
    required: true
- type: dropdown
  id: 2fa
  attributes:
    label: Two-factor auth (2FA) type 
    description: "Most accounts use \"Trusted Device\" authentication, meaning signing in on a new device will send a notification to your iPhone to allow the sign in."
    options:
      - Trusted Device
      - SMS
      - No 2FA
      - Security Key (Unsupported)
  validations:
    required: true

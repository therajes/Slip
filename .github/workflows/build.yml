name: Build Slip

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Run Core Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build native Swift application
        run: chmod +x native/build.sh && ./native/build.sh

      - name: Build DMG
        run: chmod +x native/create-dmg.sh && ./native/create-dmg.sh native/build/Slip.app native/dist/Slip-2.4.0.dmg

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Slip-2.4.0-macOS
          path: native/dist/Slip-2.4.0.dmg
